name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F. '{print $1}')
          if [ "$JAVA_VERSION" = "1" ]; then
            JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F. '{print $2}')
          fi
          echo "Detected Java major version: $JAVA_VERSION"
          if [ -z "$JAVA_VERSION" ] || [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java 17 or newer is required, but detected version is $JAVA_VERSION"
            exit 1
          fi

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "debug.keystore successfully verified."

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK existence and size
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Debug APK not found at $APK_PATH"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "Debug APK size: $APK_SIZE bytes"
          if [ "$APK_SIZE" -eq 0 ]; then
            echo "Error: Debug APK is empty!"
            exit 1
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          RUN_NUM="${{ github.run_number }}"
          RUN_ATT="${{ github.run_attempt }}"
          TAG="debug-apk-build-${RUN_NUM}-${RUN_ATT}"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
          
          ASSET_DIR="release_asset_dir"
          mkdir -p "$ASSET_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_DIR/app-debug.apk"
          echo "asset_path=$ASSET_DIR/app-debug.apk" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version
          
          TAG="${{ steps.prep_asset.outputs.RELEASE_TAG }}"
          ASSET="${{ steps.prep_asset.outputs.asset_path }}"
          
          if [ ! -f "$ASSET" ]; then
            echo "Error: Release asset not found at $ASSET"
            exit 1
          fi
          
          echo "Deleting existing tag/release if present..."
          gh release delete "$TAG" --yes || true
          git push origin --delete "$TAG" || true
          
          echo "Creating GitHub Release with tag $TAG and attaching APK..."
          gh release create "$TAG" \
            --title "Debug APK Build #${{ github.run_number }}" \
            --notes "Automated build of Maya App debug APK generated via GitHub Actions.
            - Run Number: ${{ github.run_number }}
            - Run Attempt: ${{ github.run_attempt }}
            - Commit SHA: ${{ github.sha }}
            - Signed with temporary debug keystore." \
            --latest \
            "$ASSET#app-debug.apk"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK BUILD & RELEASE STATUS ==-"
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "SUCCESS: GitHub Release published successfully!"
            gh release view "${{ steps.prep_asset.outputs.RELEASE_TAG }}"
            echo "DIRECT APK DOWNLOAD:"
            echo "https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          else
            echo "WARNING: GitHub Release publishing failed or skipped, but Actions artifact app-debug-apk is available."
          fi
